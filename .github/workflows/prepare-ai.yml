name: Prepare AI model

# Run by hand (Actions tab > Prepare AI model > Run workflow) or when this file / the script changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-ai.yml
      - tools/prepare_ai.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU)
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet numpy

      - name: Get AnimeGANv2 (face paint v2)
        run: |
          git clone --depth 1 https://github.com/bryandlee/animegan2-pytorch /tmp/ag
          curl -L --fail -o /tmp/face_paint_512_v2.pt https://github.com/bryandlee/animegan2-pytorch/raw/main/weights/face_paint_512_v2.pt

      - name: Export weights and reference outputs
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/www/ai tools/ai-ref
          set -o pipefail
          python tools/prepare_ai.py app/src/main/assets/www/ai tools/ai-ref 2>&1 | tee tools/ai-ref/export-log.txt

      - name: Vendor JavaScript libraries
        continue-on-error: true
        run: |
          LIB=app/src/main/assets/www/lib
          mkdir -p $LIB /tmp/npm && cd /tmp/npm
          npm pack --silent @tensorflow/tfjs@4.22.0 mp4box@0.5.2 mp4-muxer@5
          for f in *.tgz; do d="${f%.tgz}"; mkdir -p "$d"; tar -xzf "$f" -C "$d"; done
          find . -path ./node_modules -prune -o -name "*.js" -print | grep -E "dist|build" | sort > $GITHUB_WORKSPACE/tools/ai-ref/npm-files.txt
          ls -la >> $GITHUB_WORKSPACE/tools/ai-ref/npm-files.txt
          cd $GITHUB_WORKSPACE
          cp /tmp/npm/tensorflow-tfjs-*/package/dist/tf.min.js $LIB/
          cp /tmp/npm/tensorflow-tfjs-*/package/LICENSE $LIB/tfjs-LICENSE.txt || true
          cp /tmp/npm/mp4box-*/package/dist/mp4box.all.min.js $LIB/ || true
          cp /tmp/npm/mp4box-*/package/LICENSE $LIB/mp4box-LICENSE.txt || true
          for f in $(find /tmp/npm/mp4-muxer-* -name "mp4-muxer*.js" | grep -E "build|dist"); do cp "$f" $LIB/; done
          cp /tmp/npm/mp4-muxer-*/package/LICENSE $LIB/mp4-muxer-LICENSE.txt || true
          ls -la $LIB app/src/main/assets/www/ai tools/ai-ref

      - name: Commit generated files
        if: always()
        run: |
          mkdir -p tools/ai-ref
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/ai app/src/main/assets/www/lib tools/ai-ref
          git commit -m "Add AI cartoon model and libraries (generated by Prepare AI model)" || echo "nothing to commit"
          git push
